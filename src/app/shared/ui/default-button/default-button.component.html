<button
  [type]="type()"
  class="default-button"
  [class.--style-variant-primary]="styleVariant() === 'primary'"
  [class.--style-variant-secondary]="styleVariant() === 'secondary'"
  [class.--full-width]="fullWidth()"
  [class.--small-padding]="smallPadding()"
  [style.height]="height()"
  [style.width]="circleRadius() ? height() : null"
  [disabled]="disabled()"
  (click)="onClick($event)"
>
  @if (loading() && !disabled()) {
    <app-progress-circle [variant]="styleVariant()" />
  } @else {
    @if (iconName(); as iconName) {
      <app-icon [name]="iconName" class="button-default__icon" />
    }
    @if (label(); as label) {
      <p class="button-default__label">
        {{ label }}
      </p>
    }
  }
</button>
