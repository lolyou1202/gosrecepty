<button
  [type]="type()"
  class="button-default"
  [class.--primary]="variant() === 'primary'"
  [class.--secondary]="variant() === 'secondary'"
  [class.--full-width]="width() === 'full-width'"
  [class.--small-padding]="smallPadding()"
  [class.--disabled]="disabled()"
  [style.height]="height()"
  [style.width]="circleRadius() ? height() : null"
  [disabled]="disabled() || loading()"
  (click)="onClick($event)"
>
  @if (loading() && !disabled()) {
    <app-progress-circle
      [variant]="variant() === 'primary' ? 'secondary' : 'primary'"
    />
  } @else {
    @if (iconName(); as iconName) {
      <app-icon [name]="iconName" class="button-default__icon" />
    }
    @if (label(); as label) {
      <p class="button-default__label">
        {{ label }}
      </p>
    }
  }
</button>
