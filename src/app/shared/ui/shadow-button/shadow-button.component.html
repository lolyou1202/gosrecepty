<button
  type="button"
  [disabled]="disabled()"
  (click)="onClick($event)"
  class="shadow-button shadow-block"
  [class]="{
    'with-hover': withHover()
  }"
>
  @if (icon(); as iconName) {
    <app-icon [name]="iconName" class="shadow-button__icon" />
  }
  @if (label(); as label) {
    <p class="shadow-button__label">
      {{ label }}
    </p>
  }
</button>
