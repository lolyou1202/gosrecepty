<fieldset
  class="radio-checkbox-group__container"
  [attr.aria-invalid]="invalid() && touched() ? true : null"
  [attr.aria-describedby]="describedBy()"
  (focusout)="onFocusOut($event)"
>
  <div class="radio-checkbox-group__labels">
    @if (label()) {
      <legend class="radio-checkbox-group__label text-default" [id]="labelId">
        {{ label() }}
      </legend>
    }

    @if (hint()) {
      <p
        class="radio-checkbox-group__hint text-small text-helper"
        [id]="hintId"
      >
        {{ hint() }}
      </p>
    }
  </div>

  <div class="radio-checkbox-group__list">
    @for (option of options(); track option.id) {
      <app-radio-checkbox
        [id]="optionId(option.id)"
        [name]="nameId"
        [value]="option.id"
        [label]="option.label"
        [disabled]="disabled() || !!option.disabled"
        [checked]="value() === option.id"
        (checkedChange)="onOptionSelected(option)"
      />
    }
  </div>

  @if (invalid() && touched() && errors().length) {
    <app-error-list
      [id]="errorId"
      [errors]="errors()"
      class="radio-checkbox-group__errors"
    />
  }
</fieldset>
