<div
  class="radio-checkbox-group__container"
  role="radiogroup"
  [attr.aria-labelledby]="label() ? labelId : null"
  [attr.aria-orientation]="orientation()"
  [attr.aria-disabled]="disabled() || null"
  [attr.aria-invalid]="invalid() && touched() ? true : null"
  [attr.aria-describedby]="describedBy()"
  (focusout)="onFocusOut($event)"
>
  <div class="radio-checkbox-group__labels">
    @if (label()) {
      <p class="text-default" [id]="labelId">{{ label() }}</p>
    }
    @if (hint()) {
      <p class="text-small text-helper" [id]="hintId">{{ hint() }}</p>
    }
  </div>

  <div class="radio-checkbox-group__list">
    @for (option of options(); track option.id) {
      <app-radio-checkbox
        role="radio"
        [id]="optionId(option.id)"
        [label]="option.label"
        [checked]="selection.isSelected(option.id)"
        [disabled]="disabled() || !!option.disabled"
        [readonly]="readonly()"
        [tabindex]="getTabindex($index)"
        (selected)="onOptionSelected($index)"
        (focusin)="onFocusIn($index)"
        (keydown)="onKeydown($event, $index)"
      />
    }
  </div>

  @if (invalid() && touched() && errorMessages().length) {
    <app-error-list [errors]="errors()" class="radio-checkbox-group__errors" />
  }
</div>
