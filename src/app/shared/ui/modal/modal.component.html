<div class="modal__container">
  <div class="modal__header">
    <h3>{{ title() }}</h3>

    <button class="modal__close link-plain" (click)="close()">
      <app-icon name="cross-1" class="modal__close-icon" />
    </button>
  </div>

  <app-divider />

  <div class="modal__content">
    @if (contentComponent(); as component) {
      <ng-container
        [ngComponentOutlet]="component"
        [ngComponentOutletInputs]="contentComponentInputs()"
        [ngComponentOutletInjector]="bodyInjector()"
      />
    } @else if (contentTemplate(); as template) {
      <ng-container
        [ngTemplateOutlet]="template"
        [ngTemplateOutletContext]="contentTemplateContext()"
        [ngTemplateOutletInjector]="bodyInjector()"
      />
    } @else {
      <ng-content />
    }
  </div>

  @if (actions().length) {
    <app-divider />

    <div class="modal__footer">
      @for (action of actions(); track action.text) {
        <app-default-button
          [variant]="action.variant"
          [label]="action.text"
          [disabled]="isDisabled(action.disabled)"
          (click)="onActionClick(action)"
        />
      }
    </div>
  }
</div>
