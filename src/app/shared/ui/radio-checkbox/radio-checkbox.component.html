<label class="radio-checkbox">
  <input
    type="radio"
    class="radio-checkbox__input"
    [checked]="checked()"
    [disabled]="disabled()"
    (change)="select()"
    (blur)="touch.emit()"
  />
  <span class="radio-checkbox__box" aria-hidden="true"></span>
  <p class="radio-checkbox__label">{{ label() }}</p>
</label>
