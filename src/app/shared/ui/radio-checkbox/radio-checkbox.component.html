<div
  class="radio-checkbox__container"
  [class.--checked]="checked()"
  [class.--disabled]="disabled()"
  [class.--invalid]="invalid()"
>
  <input
    type="radio"
    class="radio-checkbox__input"
    [id]="id()"
    [name]="name()"
    [attr.tabindex]="tabindex()"
    [value]="value()"
    [checked]="checked()"
    [disabled]="disabled()"
    (click)="onClick($event)"
    (change)="onChange($event)"
  />
  <label class="radio-checkbox__label" [for]="id()">
    <span class="radio-checkbox__box" aria-hidden="true"></span>
    <span class="radio-checkbox__text text-default">{{ label() }}</span>
  </label>
</div>
