<div class="chip-group__container">
  <app-expandable-list
    [collapsible]="collapsible()"
    [(expanded)]="expanded"
    [gap]="gap()"
  >
    @for (chip of chips(); track chip.id) {
      <app-chip
        appExpandableItem
        [checked]="isSelected(chip.id)"
        (checkedChange)="toggle(chip)"
        [label]="chip.label"
        [icon]="chip.icon"
        [disabled]="!!chip.disabled"
        [variant]="chipsVariant()"
      />
    }
  </app-expandable-list>
</div>
