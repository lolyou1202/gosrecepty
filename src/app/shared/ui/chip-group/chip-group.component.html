<div [attr.role]="groupRole()" class="chip-group__container">
  @for (chip of chips(); track chip.id) {
    <app-chip
      [attr.role]="optionRole()"
      [attr.aria-checked]="selection.isSelected(chip.id)"
      [label]="chip.label"
      [icon]="chip.icon"
      [disabled]="!!chip.disabled"
      [side]="side()"
      [styleVariant]="styleVariant()"
      [checked]="selection.isSelected(chip.id)"
      (toggled)="selection.toggle(chip.id)"
    />
  }
</div>
