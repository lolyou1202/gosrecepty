  <nav class="pagination__nav">
    <app-pagination-button
      icon="arrow-left-1"
      [disabled]="currentPage() === 1"
      (clicked)="prev()"
    />

    @for (item of items(); track $index) {
      @if (isEllipsis(item)) {
        <app-pagination-button text="..." [disabled]="true" />
      } @else {
        <app-pagination-button
          [text]="item"
          [active]="item === currentPage()"
          (click)="goTo(item)"
        />
      }
    }

    <app-pagination-button
      icon="arrow-right-1"
      [disabled]="currentPage() === totalPages()"
      (click)="next()"
    />
  </nav>
</div>
