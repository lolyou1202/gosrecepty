<button
  type="button"
  [disabled]="disabled()"
  (click)="toggle()"
  class="chip__button"
  [class.shadow-block]="side() === 'outside'"
  [class.with-hover]="side() === 'outside'"
>
  @if (icon(); as iconName) {
    <app-icon [name]="iconName" size="16px" class="chip__icon" />
  }
  @if (label(); as label) {
    <p class="chip__label">{{ label }}</p>
  }
</button>
