<app-shadow-button icon="filter" [withHover]="true" (clicked)="openModal()" />

@if (hasActiveFilters()) {
  <span class="recipe-catalog-filter__dot"></span>
}

<ng-template #tpl>
  <div class="recipe-catalog-filter-modal__container">
    <div class="recipe-catalog-filter-modal__section">
      <p class="text-small">Поиск по названию</p>
      <app-base-input [formField]="form.name" [clearable]="true" />
    </div>
    <div class="recipe-catalog-filter-modal__section">
      <p class="text-small">Время приготовления</p>
      <app-chip-group
        [formField]="form.cookingTime"
        [collapsible]="false"
        [multiple]="false"
        [chips]="cookingTimeChips"
      />
    </div>
    <div class="recipe-catalog-filter-modal__section">
      <p class="text-small">Калории на 100 г</p>
      <app-chip-group
        [formField]="form.calories"
        [collapsible]="false"
        [multiple]="false"
        [chips]="caloriesChips"
      />
    </div>
  </div>
</ng-template>
